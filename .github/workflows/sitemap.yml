name: Generate Sitemap

on:
  push:
    branches:
      - main # 만약 기본 브랜치 이름이 master라면 master로 변경하세요.
    paths:
      - '**/*.html' # HTML 파일이 수정되거나 추가될 때만 작동합니다.

jobs:
  sitemap:
    runs-on: ubuntu-latest

    # =================================================================
    # [핵심 통합 부분] 에러(exit code 128) 해결을 위한 권한 설정
    # 생성된 sitemap.xml 파일을 저장소에 다시 푸시하려면 'contents: write' 권한이 필수입니다.
    # =================================================================
    permissions:
      contents: write
    # =================================================================

    steps:
      - name: 1. 내 웹사이트 코드 가져오기
        uses: actions/checkout@v4
        with:
          # 워닝(Warning) 해결 팁: Node.js 관련 워닝이 계속된다면, 
          # GitHub Action 환경이 업데이트될 때까지 기다리거나 
          # 이 액션의 버전을 최신 패치 버전(예: v4.2.1 등)으로 업데이트하세요.
          fetch-depth: 0 # 사이트맵 생성기가 파일 변경 기록을 참조할 수 있도록 전체 기록을 가져옵니다.

      - name: 2. 사이트맵 자동 생성기 실행
        uses: cicirello/generate-sitemap@v1
        with:
          base-url-path: https://loveyak.wnxbnfyba744.workers.dev/
          drop-html-extension: true # .html 확장자를 주소에서 제거합니다 (SEO에 유리).
          
      - name: 3. 만들어진 사이트맵을 서버에 자동 저장 (Commit & Push)
        # 이 단계에서 위에서 설정한 'permissions: contents: write' 권한을 사용하여 푸시합니다.
        run: |
          # Git 사용자 정보 설정 (커밋을 남기기 위해 필요)
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          # 생성된 sitemap.xml 파일을 스테이징 영역에 추가
          git add sitemap.xml
          
          # 변경사항이 있을 때만 커밋 (|| exit 0는 변경사항이 없어 커밋이 실패해도 워크플로우를 성공으로 간주함)
          git commit -m "자동: 사이트맵 업데이트 완료" || exit 0
          
          # 원격 저장소에 푸시 (이제 권한이 있으므로 성공합니다).
          git push
